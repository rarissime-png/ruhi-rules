backend:
  name: github
  repo: rarissime-png/ruhi-rules
  branch: main
media_folder: images/uploads
public_folder: /images/uploads
collections:
  - name: posts
    label: Writing
    folder: content/posts
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime}
      - {label: Category, name: category, widget: select, options: [Poem, Reflection, Short prose, Creative writing]}
      - {label: Tags, name: tags, widget: list, required: false}
      - {label: Text, name: body, widget: markdown}
  - name: books
    label: Books
    folder: content/books
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Subtitle, name: subtitle, widget: string, required: false}
      - {label: Author, name: author, widget: string, default: Ruhi Rules, required: false}
      - {label: Cover, name: cover, widget: image, required: false}
      - {label: Short description (shown on the book card), name: description, widget: text}
      - {label: Full description (shown on the book page), name: full_description, widget: markdown, required: false}
      - {label: Genre or category (for example Poetry), name: genre, widget: string, required: false}
      - {label: Number of pages, name: pages, widget: string, required: false}
      - {label: Publication date, name: pub_date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, required: false}
      - {label: Currency, name: currency, widget: select, options: [GHS, USD, EUR], required: false}
      - {label: Price (numbers only, for example 50), name: price, widget: string, required: false}
      - {label: Selar checkout link (must start with https://), name: buy_link, widget: string, required: false}
      - {label: Second checkout link for another currency (optional), name: intl_link, widget: string, required: false}
      - {label: Price shown for the second link (for example USD 5), name: intl_price, widget: string, required: false}
      - {label: Free sample PDF (optional), name: sample, widget: file, required: false}
      - {label: Show in Featured, name: featured, widget: boolean, default: false, required: false}
      - {label: Status (Hidden = not shown on the site), name: status, widget: select, options: [Hidden, Available, Upcoming], default: Hidden}
  - name: settings
    label: Website content
    files:
      - label: All website text, About, services and contact
        name: settings
        file: content/settings.json
        format: json
        fields:
          - {label: About Ruhi Rules biography, name: about, widget: text, required: false}
          - label: Home page text
            name: home
            widget: object
            collapsed: true
            fields:
              - {label: Opening line (I write. I create...), name: hero_tag, widget: string, required: false}
              - {label: Big title first word, name: hero_first, widget: string, required: false}
              - {label: Big title second word, name: hero_second, widget: string, required: false}
              - {label: Introduction paragraph, name: hero_lead, widget: text, required: false}
              - {label: Writing section title, name: writing_title, widget: string, required: false}
              - {label: Writing section intro, name: writing_intro, widget: text, required: false}
              - {label: Bookshelf title, name: shelf_title, widget: string, required: false}
              - {label: Bookshelf intro, name: shelf_intro, widget: text, required: false}
              - {label: Footer line, name: footer_tagline, widget: string, required: false}
          - label: Services
            name: services
            widget: object
            collapsed: true
            fields:
              - {label: Section title, name: title, widget: string, required: false}
              - {label: Section intro, name: intro, widget: text, required: false}
              - label: Your services (add, edit or remove)
                name: items
                widget: list
                required: false
                fields:
                  - {label: Service name, name: title, widget: string}
                  - {label: What it includes, name: points, widget: list, required: false}
                  - {label: Email subject for the Enquire button, name: subject, widget: string, required: false}
          - label: Contact details
            name: contact
            widget: object
            collapsed: true
            fields:
              - {label: Heading, name: title, widget: string, required: false}
              - {label: Intro sentence, name: intro, widget: text, required: false}
              - {label: Email address, name: email, widget: string, required: false}
              - {label: Phone shown on the site, name: phone, widget: string, required: false}
              - {label: WhatsApp number (digits only, with country code), name: whatsapp, widget: string, required: false}
          - label: Social media links (add as many as you like)
            name: socials
            widget: list
            required: false
            fields:
              - {label: Name (Instagram, TikTok...), name: name, widget: string}
              - {label: Full link, name: url, widget: string}
          - label: Google search text
            name: seo
            widget: object
            collapsed: true
            fields:
              - {label: Page title, name: title, widget: string, required: false}
              - {label: Short description, name: description, widget: text, required: false}
          - {label: Thoughts to take with you, name: thoughts, widget: list, required: false}
          - {label: Note shown under the books, name: payment_note, widget: text, required: false}
